<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>큐 동작 과정 - 작게 보기</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap');

      body {
        font-family: 'Montserrat', sans-serif;
        color: #333;
        padding: 20px;
        min-height: 100vh;
      }

      h1 {
        text-align: center;
        margin-bottom: 30px;
        color: #2c3e50;
        text-shadow: 1px 1px 3px #bdc3c7;
        font-size: 1.6rem;
      }

      .step {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        padding: 18px 22px;
        margin-bottom: 24px;
        max-width: 520px;
        margin-left: auto;
        margin-right: auto;
        position: relative;
        user-select: none;
        border: 1px solid #f1c40f;
      }

      .step-label {
        font-size: 1rem;
        font-weight: 600;
        margin-bottom: 12px;
        letter-spacing: 0.03em;
      }

      .queue-box {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 2px solid #f1c40f;
        border-radius: 12px;
        padding: 10px 18px;
        background: #ecf0f1;
        min-height: 50px;
        position: relative;
      }

      .item {
        min-width: 38px;
        height: 38px;
        border-radius: 10px;
        color: #fff;
        font-weight: 700;
        font-size: 1rem;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: transform 0.3s ease;
        user-select: none;
        background-color: #f1c40f;
      }

      /* 앞/뒤 표시용 화살표 */
      .front-arrow,
      .rear-arrow {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        font-weight: 700;
        font-size: 0.95rem;
        color: #f1c40f;
        user-select: none;
        background: #fff;
        padding: 1px 5px;
        border-radius: 7px;
        box-shadow: 0 2px 6px #f1c40f;
        letter-spacing: 0.05em;
        white-space: nowrap;
      }
      .front-arrow {
        left: -65px;
      }
      .rear-arrow {
        right: -50px;
      }
    </style>
  </head>
  <body>
    <h1>큐 동작 과정 (FIFO) 작게 보기</h1>

    <!-- 1단계 -->
    <section class="step">
      <div class="step-label">1. 초기 상태 (빈 큐)</div>
      <div
        class="queue-box"
        style="
          justify-content: center;
          color: #7f8c8d;
          font-weight: 600;
          font-size: 1rem;
        "
      >
        큐가 비어있음
      </div>
    </section>

    <!-- 2단계 -->
    <section class="step">
      <div class="step-label">2. enqueue(10)</div>
      <div class="queue-box">
        <div class="front-arrow">Front ←</div>
        <div class="item">10</div>
        <div class="rear-arrow">Rear ←</div>
      </div>
    </section>

    <!-- 3단계 -->
    <section class="step">
      <div class="step-label">3. enqueue(20)</div>
      <div class="queue-box">
        <div class="front-arrow">Front ←</div>
        <div class="item">10</div>
        <div class="item">20</div>
        <div class="rear-arrow">Rear ←</div>
      </div>
    </section>

    <!-- 4단계 -->
    <section class="step">
      <div class="step-label">4. dequeue() → 10 제거</div>
      <div class="queue-box">
        <div class="front-arrow">Front ←</div>
        <div class="item">20</div>
        <div class="rear-arrow">Rear ←</div>
      </div>
    </section>

    <!-- 5단계 -->
    <section class="step">
      <div class="step-label">5. enqueue(30)</div>
      <div class="queue-box">
        <div class="front-arrow">Front ←</div>
        <div class="item">20</div>
        <div class="item">30</div>
        <div class="rear-arrow">Rear ←</div>
      </div>
    </section>
  </body>
</html>
