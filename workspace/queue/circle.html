<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>원형 큐 순서도</title>
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #f9f9f9;
      }
      svg {
        width: 400px;
        height: 400px;
      }
      .slot {
        fill: #fff8dc;
        stroke: #f1c40f;
        stroke-width: 3;
      }
      .highlight-front {
        fill: #f1c40f;
        opacity: 0.4;
      }
      .highlight-rear {
        fill: #f39c12;
        opacity: 0.4;
      }
      text {
        font-weight: 600;
        fill: #333;
        user-select: none;
      }
      .label-front {
        fill: #f1c40f;
        font-weight: 700;
      }
      .label-rear {
        fill: #f39c12;
        font-weight: 700;
      }
      .arrow {
        fill: none;
        stroke: #f1c40f;
        stroke-width: 3;
        marker-end: url(#arrowhead);
      }
      .arrow-dequeue {
        stroke: #3498db;
        marker-end: url(#arrowhead-blue);
      }
      .desc {
        font-size: 14px;
        fill: #555;
      }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 400 400" aria-label="원형 큐 순서도" role="img">
      <defs>
        <marker
          id="arrowhead"
          markerWidth="10"
          markerHeight="7"
          refX="10"
          refY="3.5"
          orient="auto"
          fill="#f1c40f"
        >
          <polygon points="0 0, 10 3.5, 0 7" />
        </marker>
        <marker
          id="arrowhead-blue"
          markerWidth="10"
          markerHeight="7"
          refX="10"
          refY="3.5"
          orient="auto"
          fill="#3498db"
        >
          <polygon points="0 0, 10 3.5, 0 7" />
        </marker>
      </defs>

      <!-- 6개 슬롯 -->
      <g transform="translate(200,200)">
        <circle r="140" fill="#fff8dc" stroke="#f1c40f" stroke-width="3" />
        <!-- 슬롯 구획 선과 번호 -->
        <g>
          <!-- 각 슬롯 구획 선 -->
          <line
            x1="0"
            y1="0"
            x2="0"
            y2="-140"
            stroke="#f1c40f"
            stroke-width="2"
          />
          <line
            transform="rotate(60)"
            x1="0"
            y1="0"
            x2="0"
            y2="-140"
            stroke="#f1c40f"
            stroke-width="2"
          />
          <line
            transform="rotate(120)"
            x1="0"
            y1="0"
            x2="0"
            y2="-140"
            stroke="#f1c40f"
            stroke-width="2"
          />
          <line
            transform="rotate(180)"
            x1="0"
            y1="0"
            x2="0"
            y2="-140"
            stroke="#f1c40f"
            stroke-width="2"
          />
          <line
            transform="rotate(240)"
            x1="0"
            y1="0"
            x2="0"
            y2="-140"
            stroke="#f1c40f"
            stroke-width="2"
          />
          <line
            transform="rotate(300)"
            x1="0"
            y1="0"
            x2="0"
            y2="-140"
            stroke="#f1c40f"
            stroke-width="2"
          />

          <!-- 번호 텍스트 -->
          <text x="0" y="-110" text-anchor="middle" dominant-baseline="middle">
            0
          </text>
          <text
            transform="rotate(60)"
            x="0"
            y="-110"
            text-anchor="middle"
            dominant-baseline="middle"
          >
            1
          </text>
          <text
            transform="rotate(120)"
            x="0"
            y="-110"
            text-anchor="middle"
            dominant-baseline="middle"
          >
            2
          </text>
          <text
            transform="rotate(180)"
            x="0"
            y="-110"
            text-anchor="middle"
            dominant-baseline="middle"
          >
            3
          </text>
          <text
            transform="rotate(240)"
            x="0"
            y="-110"
            text-anchor="middle"
            dominant-baseline="middle"
          >
            4
          </text>
          <text
            transform="rotate(300)"
            x="0"
            y="-110"
            text-anchor="middle"
            dominant-baseline="middle"
          >
            5
          </text>
        </g>

        <!-- front 위치 표시 (예: 1) -->
        <circle cx="121" cy="-70" r="30" class="highlight-front" />
        <text
          x="121"
          y="-70"
          text-anchor="middle"
          dominant-baseline="middle"
          class="label-front"
        >
          front
        </text>

        <!-- rear 위치 표시 (예: 4) -->
        <circle cx="-121" cy="70" r="30" class="highlight-rear" />
        <text
          x="-121"
          y="70"
          text-anchor="middle"
          dominant-baseline="middle"
          class="label-rear"
        >
          rear
        </text>

        <!-- enqueue 방향 화살표 -->
        <path d="M -110 70 A 140 140 0 0 1 -80 135" class="arrow" />
        <text x="-80" y="145" class="desc">enqueue (rear 증가)</text>

        <!-- dequeue 방향 화살표 -->
        <path d="M 130 -65 A 140 140 0 0 0 105 -135" class="arrow-dequeue" />
        <text x="110" y="-150" class="desc" style="fill: #3498db">
          dequeue (front 증가)
        </text>

        <!-- 원 중심 -->
        <circle r="5" fill="#f1c40f" />
      </g>
    </svg>
  </body>
</html>
