<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>삽입 정렬</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2>삽입 정렬</h2>
    <div
      style="

        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      "

      <span
        style="
          display: inline-block;
          width: 20px;
          height: 20px;
          background-color: #f1c40f;
          margin-right: 5px;
          border: 1px solid #999;
        "
      ></span>
      <span style="margin-right: 15px">확정</span>

      <span
        style="
          display: inline-block;
          width: 20px;
          height: 20px;
          background-color: #eeb0a9;
          margin-right: 5px;
          border: 1px solid #999;
        "
      ></span>
      <span>비교중</span>
    </div>
    <div class="container" id="container"></div>

    <script src="script.js"></script>
  </body>
</html>
